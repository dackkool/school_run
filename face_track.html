<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校學生出入紀錄系統</title>
    <!-- 載入 Tailwind CSS 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 face-api.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <!-- 頂部標題 -->
        <header class="bg-indigo-600 text-white rounded-xl p-6 shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">🏫 學校學生出入與點名系統</h1>
                <p class="text-indigo-200 text-sm mt-1">支援多人同時辨識、進出時間自動紀錄與 CSV 匯出</p>
            </div>
            <div id="model-status" class="mt-4 sm:mt-0 bg-indigo-700 text-indigo-100 px-4 py-2 rounded-lg text-sm font-medium animate-pulse">
                狀態：正在載入 AI 模型...
            </div>
        </header>

        <!-- 頁籤導覽列 -->
        <div class="flex space-x-2 border-b border-gray-200 mb-6">
            <button onclick="switchTab('register')" id="btn-tab-register" class="tab-btn px-6 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors">
                1. 學生註冊
            </button>
            <button onclick="switchTab('tracker')" id="btn-tab-tracker" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-indigo-600 focus:outline-none transition-colors">
                2. 鏡頭出入紀錄
            </button>
        </div>

        <!-- 頁籤一：學生註冊 -->
        <div id="tab-register" class="tab-content active bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-700">註冊新學生臉部資料</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 左側：視訊與拍照 -->
                <div class="flex flex-col items-center">
                    <div class="relative w-full max-w-md bg-black rounded-lg overflow-hidden shadow-inner aspect-video">
                        <video id="reg-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                        <canvas id="reg-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    </div>
                    <button onclick="captureStudent()" id="btn-capture" disabled class="mt-4 w-full max-w-md bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow disabled:opacity-50 transition-all">
                        拍照並註冊學生
                    </button>
                </div>
                <!-- 右側：表單與已註冊名單 -->
                <div class="flex flex-col justify-between">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">學號 (ID)</label>
                            <input type="text" id="reg-id" placeholder="例如：2026001" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">學生姓名</label>
                            <input type="text" id="reg-name" placeholder="例如：陳大文" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div id="reg-msg" class="text-sm font-semibold h-6"></div>
                    </div>

                    <div class="mt-6 border-t pt-4">
                        <h3 class="font-bold text-gray-700 mb-2">已註冊學生清單 (<span id="student-count">0</span>)</h3>
                        <div id="student-list" class="max-h-40 overflow-y-auto space-y-2 bg-gray-50 p-3 rounded-lg border">
                            <p class="text-gray-400 text-sm">尚無註冊學生</p>
                        </div>
                        <button onclick="clearAllStudents()" class="mt-3 text-sm text-red-600 hover:underline">清除所有註冊資料</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 頁籤二：鏡頭出入紀錄 -->
        <div id="tab-tracker" class="tab-content bg-white rounded-xl shadow-md p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">鏡頭多人在線辨識與出入紀錄</h2>
                <div class="space-x-2 mt-2 sm:mt-0">
                    <button onclick="startTracker()" id="btn-start" disabled class="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-lg shadow disabled:opacity-50">
                        開啟鏡頭辨識
                    </button>
                    <button onclick="stopTracker()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2 rounded-lg shadow">
                        停止辨識
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 攝影機畫面 -->
                <div class="lg:col-span-2 flex flex-col items-center">
                    <div class="relative w-full bg-black rounded-lg overflow-hidden shadow-inner aspect-video">
                        <video id="track-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                        <canvas id="track-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">提示：畫面支援同時辨識多位學生，系統會自動抓取最近出現的時間並紀錄進出。</p>
                </div>

                <!-- 即時紀錄與 CSV 下載 -->
                <div class="flex flex-col h-full bg-gray-50 p-4 rounded-xl border">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-700">出入事件 CSV 紀錄</h3>
                        <button onclick="downloadCSV()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow">
                            下載 CSV 報表
                        </button>
                    </div>
                    <div id="log-container" class="flex-1 min-h-[250px] max-h-[320px] overflow-y-auto bg-white border rounded-lg p-2 space-y-1 font-mono text-xs">
                        <p class="text-gray-400">尚無出入事件紀錄...</p>
                    </div>
                    <button onclick="clearLogs()" class="mt-2 text-xs text-red-600 hover:underline text-right">清空紀錄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let labeledFaceDescriptors = [];
        let faceMatcher = null;
        let regStream = null;
        let trackStream = null;
        let trackerInterval = null;
        let attendanceLogs = [];
        
        // 追蹤學生活動狀態以防重複洗版紀錄
        // 格式: { studentKey: { name, lastSeenTime, entryTime } }
        let activeStudents = {};

        // 初始化載入 AI 模型
        async function loadModels() {
            const statusEl = document.getElementById('model-status');
            try {
                // 使用 jsDelivr 載入官方模型檔案
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
                statusEl.innerText = '狀態：載入人臉偵測模型...';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                statusEl.innerText = '狀態：載入特徵點模型...';
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                statusEl.innerText = '狀態：載入辨識模型...';
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                statusEl.innerText = '狀態：AI 模型就緒！';
                statusEl.className = 'mt-4 sm:mt-0 bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium';
                
                document.getElementById('btn-capture').disabled = false;
                document.getElementById('btn-start').disabled = false;

                loadStoredFaces();
            } catch (error) {
                console.error(error);
                statusEl.innerText = '狀態：模型載入失敗，請檢查網路';
                statusEl.className = 'mt-4 sm:mt-0 bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium';
            }
        }

        // 切換頁籤
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600');
                el.classList.add('text-gray-500');
            });

            document.getElementById(`tab-${tabName}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-tab-${tabName}`);
            activeBtn.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600');
            activeBtn.classList.remove('text-gray-500');

            if (tabName === 'register') {
                stopTracker();
                startCamera('reg-video');
            } else {
                stopCamera('reg-video');
                startCamera('track-video');
            }
        }

        // 啟動指定攝影機
        async function startCamera(videoElementId) {
            try {
                const videoEl = document.getElementById(videoElementId);
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                videoEl.srcObject = stream;
                if (videoElementId === 'reg-video') regStream = stream;
                if (videoElementId === 'track-video') trackStream = stream;
            } catch (err) {
                alert('無法存取攝影機，請確保已授權瀏覽器相機權限。');
            }
        }

        function stopCamera(videoElementId) {
            const videoEl = document.getElementById(videoElementId);
            if (videoEl && videoEl.srcObject) {
                videoEl.srcObject.getTracks().forEach(track => track.stop());
                videoEl.srcObject = null;
            }
        }

        // 從 LocalStorage 載入已儲存的學生臉孔
        function loadStoredFaces() {
            const savedData = localStorage.getItem('school_students');
            if (!savedData) return;

            const parsed = JSON.parse(savedData);
            labeledFaceDescriptors = parsed.map(item => {
                const descriptors = item.descriptors.map(d => new Float32Array(d));
                return new faceapi.LabeledFaceDescriptors(item.label, descriptors);
            });

            if (labeledFaceDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.55);
            }
            updateStudentListUI(parsed);
        }

        // 更新學生清單介面
        function updateStudentListUI(parsedData) {
            const listEl = document.getElementById('student-list');
            document.getElementById('student-count').innerText = parsedData.length;
            if (parsedData.length === 0) {
                listEl.innerHTML = '<p class="text-gray-400 text-sm">尚無註冊學生</p>';
                return;
            }
            listEl.innerHTML = parsedData.map(s => `
                <div class="flex justify-between items-center bg-white p-2 rounded border text-sm">
                    <span><b>${s.label.split('_')[0]}</b> (${s.label.split('_')[1] || ''})</span>
                    <button onclick="removeStudent('${s.label}')" class="text-red-500 hover:text-red-700 text-xs font-bold">刪除</button>
                </div>
            `).join('');
        }

        // 註冊學生臉部
        async function captureStudent() {
            const studentId = document.getElementById('reg-id').value.trim();
            const studentName = document.getElementById('reg-name').value.trim();
            const msgEl = document.getElementById('reg-msg');

            if (!studentId || !studentName) {
                msgEl.innerText = '請先填寫學號與姓名！';
                msgEl.className = 'text-sm font-semibold text-red-600 h-6';
                return;
            }

            msgEl.innerText = '正在偵測臉部特徵，請保持面向鏡頭...';
            msgEl.className = 'text-sm font-semibold text-indigo-600 h-6';

            const videoEl = document.getElementById('reg-video');
            const detection = await faceapi.detectSingleFace(videoEl).withFaceLandmarks().withFaceDescriptor();

            if (!detection) {
                msgEl.innerText = '找不到清晰人臉，請重新調整位置拍照！';
                msgEl.className = 'text-sm font-semibold text-red-600 h-6';
                return;
            }

            const labelKey = `${studentId}_${studentName}`;
            let existing = JSON.parse(localStorage.getItem('school_students') || '[]');
            
            let studentEntry = existing.find(s => s.label === labelKey);
            if (studentEntry) {
                studentEntry.descriptors.push(Array.from(detection.descriptor));
            } else {
                existing.push({
                    label: labelKey,
                    descriptors: [Array.from(detection.descriptor)]
                });
            }

            localStorage.setItem('school_students', JSON.stringify(existing));
            loadStoredFaces();

            msgEl.innerText = `成功註冊學生：${studentName} (${studentId})！`;
            msgEl.className = 'text-sm font-semibold text-green-600 h-6';
            document.getElementById('reg-id').value = '';
            document.getElementById('reg-name').value = '';
        }

        // 刪除單一學生
        function removeStudent(label) {
            let existing = JSON.parse(localStorage.getItem('school_students') || '[]');
            existing = existing.filter(s => s.label !== label);
            localStorage.setItem('school_students', JSON.stringify(existing));
            labeledFaceDescriptors = existing.map(item => {
                const descriptors = item.descriptors.map(d => new Float32Array(d));
                return new faceapi.LabeledFaceDescriptors(item.label, descriptors);
            });
            faceMatcher = labeledFaceDescriptors.length > 0 ? new faceapi.FaceMatcher(labeledFaceDescriptors, 0.55) : null;
            updateStudentListUI(existing);
        }

        // 清除所有學生
        function clearAllStudents() {
            if (confirm('確定要清除所有學生資料嗎？')) {
                localStorage.removeItem('school_students');
                labeledFaceDescriptors = [];
                faceMatcher = null;
                updateStudentListUI([]);
            }
        }

        // 啟動多人追蹤辨識
        async function startTracker() {
            if (!faceMatcher) {
                alert('目前沒有任何已註冊的學生，請先至「學生註冊」頁籤新增學生！');
                return;
            }
            await startCamera('track-video');
            const videoEl = document.getElementById('track-video');
            const canvasEl = document.getElementById('track-canvas');
            
            // 確保影片尺寸正確
            videoEl.onloadedmetadata = () => {
                canvasEl.width = videoEl.videoWidth;
                canvasEl.height = videoEl.videoHeight;
            };

            if (trackerInterval) clearInterval(trackerInterval);

            trackerInterval = setInterval(async () => {
                if (videoEl.paused || videoEl.ended) return;

                const detections = await faceapi.detectAllFaces(videoEl)
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const ctx = canvasEl.getContext('2d');
                ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

                const dims = faceapi.matchDimensions(canvasEl, videoEl, true);
                const resizedDetections = faceapi.resizeResults(detections, dims);

                const now = new Date();
                const currentLabelsInFrame = new Set();

                resizedDetections.forEach(detection => {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    let label = bestMatch.toString();
                    let studentName = "未知訪客";
                    let studentId = "";

                    if (bestMatch.label !== 'unknown') {
                        const parts = bestMatch.label.split('_');
                        studentId = parts[0];
                        studentName = parts[1];
                        currentLabelsInFrame.add(bestMatch.label);

                        // 紀錄進出或持續在場
                        handleStudentAttendance(studentId, studentName, now);
                    }

                    // 畫出方框與名稱
                    const box = detection.detection.box;
                    const drawBox = new faceapi.draw.DrawBox(box, { 
                        label: bestMatch.label !== 'unknown' ? `${studentName} (${studentId})` : '未知',
                        boxColor: bestMatch.label !== 'unknown' ? '#10B981' : '#EF4444'
                    });
                    drawBox.draw(canvasEl);
                });

                // 檢查是否有離開畫面的學生（超過 5 秒未出現在鏡頭則視為離開）
                checkStudentExits(now);

            }, 800); // 每 0.8 秒檢測一次，平衡流暢度與效能
        }

        function stopTracker() {
            if (trackerInterval) {
                clearInterval(trackerInterval);
                trackerInterval = null;
            }
            stopCamera('track-video');
        }

        // 處理學生進出與紀錄邏輯
        function handleStudentAttendance(id, name, time) {
            const key = id;
            const timeStr = time.toLocaleTimeString();

            if (!activeStudents[key]) {
                // 首次偵測進入畫面
                activeStudents[key] = {
                    id: id,
                    name: name,
                    entryTime: timeStr,
                    lastSeen: time
                };
                addLogEntry(`[進入] 學號 ${id} - ${name} 於 ${timeStr} 進入鏡頭範圍`);
            } else {
                // 持續在鏡頭內，更新最後看見時間
                activeStudents[key].lastSeen = time;
            }
        }

        // 檢查離開超過一定時間的學生
        function checkStudentExits(now) {
            for (const key in activeStudents) {
                const student = activeStudents[key];
                const diffSeconds = (now - student.lastSeen) / 1000;
                
                // 如果超過 5 秒沒有再次被鏡頭拍到，判定為離開
                if (diffSeconds > 5) {
                    const exitTimeStr = new Date().toLocaleTimeString();
                    addLogEntry(`[離開] 學號 ${student.id} - ${student.name} 離開鏡頭 (逗留約 ${Math.round((now - student.lastSeen)/1000 + 5)} 秒)`);
                    
                    // 記錄到 CSV 陣列
                    attendanceLogs.push({
                        id: student.id,
                        name: student.name,
                        date: new Date().toLocaleDateString(),
                        entry: student.entryTime,
                        exit: exitTimeStr
                    });

                    delete activeStudents[key];
                }
            }
        }

        // 新增介面紀錄訊息
        function addLogEntry(text) {
            const container = document.getElementById('log-container');
            if (container.innerHTML.includes('尚無出入事件紀錄')) {
                container.innerHTML = '';
            }
            const p = document.createElement('div');
            p.className = 'border-b pb-1 text-gray-700';
            p.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            container.prepend(p);
        }

        function clearLogs() {
            attendanceLogs = [];
            document.getElementById('log-container').innerHTML = '<p class="text-gray-400">尚無出入事件紀錄...</p>';
        }

        // 匯出 CSV 報表
        function downloadCSV() {
            if (attendanceLogs.length === 0) {
